name: Send RabbitEARS Volunteer Update

on:
  schedule:
    - cron: "0 10 * * 1,3,5"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  send-update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: whatsapp-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Create Google credential files
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Generate and email volunteer update
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: node cloud.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload volunteer update
        uses: actions/upload-pages-artifact@v4
        with:
          path: whatsapp-bot/site

      - name: Deploy volunteer update
        id: deployment
        uses: actions/deploy-pages@v4